<script>
/* ====================== definición de los registros ====================== */
const REG = [
 { id:"higiene_tambo", nombre:"Higiene del tambo", color:"var(--azul)",
   desc:"Lavado y desinfección de máquina, tanque y sala", anexo:"Anexo 7",
   tipo:"tareas", tareas:[
   {g:"Máquina de ordeñe", id:"mo_lav", n:"Lavado", f:"ordeñe"},
   {g:"Máquina de ordeñe", id:"mo_des", n:"Desinfección", f:"ordeñe"},
   {g:"Tanque de frío", id:"tf_lav", n:"Lavado", f:"diaria"},
   {g:"Tanque de frío", id:"tf_des", n:"Desinfección", f:"diaria"},
   {g:"Tambo y sala de espera", id:"ts_pis", n:"Lavado de pisos, paredes y caños", f:"diaria"},
   {g:"Tambo y sala de espera", id:"ts_pro", n:"Lavado profundo", f:"semanal"},
   {g:"Tambo y sala de espera", id:"ts_chk", n:"Chequeo de higiene de línea de leche, recibidor, colectores y línea de vacío", f:"semanal"}
 ]},
 { id:"higiene_queseria", nombre:"Higiene de la quesería", color:"var(--azul)",
   desc:"Elaboración, salmuera y cámara de maduración", anexo:"Anexo 12.4",
   tipo:"tareas", tareas:[
   {g:"Sala de elaboración", id:"se_tina", n:"Tina", f:"diaria"},
   {g:"Sala de elaboración", id:"se_uten", n:"Utensilios y mesadas", f:"diaria"},
   {g:"Sala de elaboración", id:"se_pis", n:"Pisos", f:"diaria"},
   {g:"Sala de elaboración", id:"se_par", n:"Paredes y ventanas", f:"semanal"},
   {g:"Sala de salmuera", id:"ss_pis", n:"Pisos", f:"diaria"},
   {g:"Sala de salmuera", id:"ss_par", n:"Paredes", f:"semanal"},
   {g:"Sala de salmuera", id:"ss_tab", n:"Tablas de escurrido", f:"semanal"},
   {g:"Cámara de maduración", id:"cm_pis", n:"Pisos", f:"diaria"},
   {g:"Cámara de maduración", id:"cm_tab", n:"Tablas de maduración", f:"semanal"},
   {g:"Cámara de maduración", id:"cm_caj", n:"Cajones plásticos", f:"cada uso"}
 ]},
 { id:"elaboracion", nombre:"Elaboración", color:"var(--verde)",
   desc:"Control del proceso, horma por horma", anexo:"Anexo 11.1",
   tipo:"form", campos:[
   {id:"litros", n:"Litros de leche", t:"num", arr:true},
   {id:"h_fer", n:"Hora fermento", t:"hora"},
   {id:"h_cua", n:"Hora cuajo", t:"hora"},
   {id:"h_cor", n:"Hora corte", t:"hora"},
   {id:"l_agua", n:"Litros de agua", t:"num", arr:true},
   {id:"t_coc", n:"Temperatura cocción °C", t:"num", arr:true},
   {id:"t_punto", n:"Tiempo tomar punto (min)", t:"num", arr:true},
   {id:"h_pre", n:"Hora entrada a prensa", t:"hora"},
   {id:"h_v1", n:"Hora 1ª vuelta", t:"hora"},
   {id:"h_v2", n:"Hora 2ª vuelta", t:"hora"},
   {id:"h_v3", n:"Hora 3ª vuelta", t:"hora"},
   {id:"h_v4", n:"Hora 4ª vuelta", t:"hora"},
   {id:"hormas", n:"N° de hormas", t:"num", arr:true},
   {id:"acidez", n:"Acidez final °D", t:"num", arr:true},
   {id:"h_sal", n:"Hora de salida", t:"hora"},
   {id:"suero_d", n:"Destino del suero", t:"texto", arr:true}
 ]},
 { id:"maduracion", nombre:"Maduración", color:"var(--verde)",
   desc:"Entrada y salida de cámara por lote", anexo:"Anexo 11.2",
   tipo:"form", campos:[
   {id:"f_elab", n:"Fecha de elaboración", t:"fecha"},
   {id:"f_ent", n:"Fecha entrada a cámara", t:"fecha"},
   {id:"h_ent", n:"Hora de entrada", t:"hora"},
   {id:"hormas", n:"N° de hormas", t:"num", arr:true},
   {id:"tina", n:"N° de tina", t:"num", arr:true},
   {id:"tipo", n:"Tipo de queso", t:"texto", arr:true},
   {id:"f_sal", n:"Fecha salida de cámara", t:"fecha"}
 ]},
 { id:"suero", nombre:"Suero", color:"var(--ambar)",
   desc:"Volumen producido y destino final", anexo:"Requisito A4-3",
   tipo:"form", campos:[
   {id:"litros", n:"Litros de suero", t:"num", arr:true},
   {id:"destino", n:"Destino", t:"texto", arr:true}
 ]},
 { id:"insumos", nombre:"Compra de insumos", color:"var(--ambar)",
   desc:"Raciones e ingredientes que entran al predio", anexo:"Anexo 8 · requisito T3-8",
   tipo:"form", campos:[
   {id:"f_compra", n:"Fecha de compra", t:"fecha"},
   {id:"producto", n:"Producto", t:"texto", arr:true},
   {id:"cantidad", n:"Cantidad", t:"texto"},
   {id:"proveedor", n:"Proveedor", t:"texto", arr:true},
   {id:"vence", n:"Fecha de vencimiento", t:"fecha"},
   {id:"remito", n:"N° de remito", t:"texto"}
 ]}
];
const regPorId = {}; REG.forEach(r=>regPorId[r.id]=r);

/* ====================== estado ====================== */
const KEY = "elcasco-reg-v1";
let S = {cfg:{predio:"El Casco", personas:["Carlos"], url:"", url2:"", ultima:""}, datos:{}, pend:[], ultimo:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
if(!S.cfg.personas || !S.cfg.personas.length) S.cfg.personas = ["Carlos"];
function guardar(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ avisar("No se pudo guardar"); } }

const hoyISO = ()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const ahoraHM = ()=>{ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dmy = s => s && /^\d{4}-\d{2}-\d{2}$/.test(s) ? s.split("-").reverse().join("/") : (s||"");

function filas(regId){ return (S.datos[regId] || []); }
function agregarFila(regId, fila){
  S.datos[regId] = S.datos[regId] || [];
  fila._id = regId+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  S.datos[regId].push(fila);
  S.pend.push({reg:regId, id:fila._id});
  guardar(); sincronizar();
  return fila;
}

/* ====================== sincronización ====================== */
let sincronizando = false;
const destinos = ()=> [S.cfg.url, S.cfg.url2].map(u=>(u||"").trim()).filter(Boolean);
function pintarSync(){
  const el = document.getElementById("sync"), t = document.getElementById("sync-t");
  const n = S.pend.length, d = destinos().length;
  if(!d){ el.dataset.s="off"; t.textContent = n ? n+" sin enviar" : "Sólo en la tablet"; return; }
  if(n){ el.dataset.s="pend"; t.textContent = n+" por enviar"; }
  else { el.dataset.s="ok"; t.textContent = d>1 ? "Enviado a las 2 planillas" : "Todo enviado"; }
}
async function sincronizar(){
  pintarSync();
  const dest = destinos();
  if(sincronizando || !dest.length || !S.pend.length || !navigator.onLine) return;
  sincronizando = true;
  const lote = S.pend.slice(0, 40);
  const cuerpo = lote.map(p=>{
    const f = (S.datos[p.reg]||[]).find(x=>x._id===p.id);
    return f ? Object.assign({registro:p.reg, predio:S.cfg.predio}, f) : null;
  }).filter(Boolean);
  const paquete = JSON.stringify({filas: cuerpo});
  let logrados = 0;
  for(const url of dest){
    try{
      await fetch(url, {method:"POST", mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"}, body: paquete});
      logrados++;
    }catch(e){ /* ese destino queda para el próximo intento */ }
  }
  // si hay dos planillas, el registro sigue pendiente hasta que llegue a las dos;
  // las filas repetidas no se duplican porque el script las descarta por _id
  if(logrados === dest.length){
    const ids = new Set(lote.map(p=>p.id));
    S.pend = S.pend.filter(p=>!ids.has(p.id));
    guardar();
  }
  sincronizando = false;
  pintarSync();
}
window.addEventListener("online", sincronizar);
setInterval(sincronizar, 60000);

/* ====================== navegación ====================== */
let vista = "inicio", regAct = null;
function ir(v, reg){
  vista = v; regAct = reg || null;
  ["inicio","form","hist","ajustes"].forEach(x=>{
    document.getElementById("v-"+x).hidden = (x!==v);
  });
  document.getElementById("b-inicio").hidden = (v==="inicio");
  window.scrollTo(0,0);
  if(v==="inicio") pintarInicio();
  else if(v==="form") pintarForm();
  else if(v==="hist") pintarHist();
  else pintarAjustes();
}
document.getElementById("b-inicio").onclick = ()=>ir("inicio");

/* ====================== inicio ====================== */
function estadoHoy(r){
  const h = hoyISO();
  if(r.tipo==="tareas"){
    const f = filas(r.id).filter(x=>x.fecha===h);
    const diarias = r.tareas.filter(t=>t.f==="diaria"||t.f==="ordeñe").length;
    const hechas = new Set(f.map(x=>x.tarea)).size;
    if(!hechas) return ["falta","Sin marcar"];
    return hechas>=diarias ? ["hecho","Al día"] : ["falta", hechas+" de "+diarias];
  }
  const n = filas(r.id).filter(x=>x.fecha===h).length;
  return n ? ["hecho", n===1?"1 registro hoy":n+" registros hoy"] : ["", "Sin registros hoy"];
}
function pintarInicio(){
  const d = new Date();
  document.getElementById("hoy").textContent =
    d.toLocaleDateString("es-UY",{weekday:"long", day:"numeric", month:"long"});
  document.getElementById("marca").textContent = S.cfg.predio || "Registros";
  let h = '<h1>¿Qué vas a anotar?</h1>'+
    '<p class="sub">Tocá el registro. Lo que cargues queda guardado en la tablet aunque no haya internet.</p>'+
    '<div class="tiles">';
  REG.forEach(r=>{
    const [e, txt] = estadoHoy(r);
    h += '<button class="tile" data-r="'+r.id+'" style="border-left-color:'+r.color+'">'+
      '<span class="n">'+esc(r.nombre)+'</span>'+
      '<span class="d">'+esc(r.desc)+'</span>'+
      '<span class="est" data-e="'+e+'">'+esc(txt)+'</span></button>';
  });
  h += '</div><div class="fila" style="margin-top:22px">'+
    '<button class="btn sm ghost" id="b-hist">Ver lo registrado</button>'+
    '<button class="btn sm ghost" id="b-aju">Ajustes</button></div>';
  document.getElementById("v-inicio").innerHTML = h;
  document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>ir("form", b.dataset.r));
  document.getElementById("b-hist").onclick = ()=>ir("hist");
  document.getElementById("b-aju").onclick = ()=>ir("ajustes");
  pintarSync();
}

/* ====================== formulario ====================== */
let borrador = {};
function pintarForm(){
  const r = regPorId[regAct];
  const el = document.getElementById("v-form");
  if(r.tipo==="tareas") return pintarTareas(r, el);

  borrador = {};
  const ult = S.ultimo[r.id] || {};
  r.campos.forEach(c=>{
    if(c.t==="fecha") borrador[c.id] = hoyISO();
    else if(c.arr && ult[c.id]!=null && ult[c.id]!=="") borrador[c.id] = ult[c.id];
    else borrador[c.id] = "";
  });

  let h = '<h1>'+esc(r.nombre)+'</h1>'+
    '<p class="sub">'+esc(r.desc)+' · '+esc(r.anexo)+'</p>';
  const hayArr = r.campos.some(c=>c.arr && ult[c.id]!=null && ult[c.id]!=="");
  if(hayArr) h += '<div class="aviso"><b>Los valores en ámbar vienen del registro anterior.</b> '+
    'Si hoy son los mismos, no toques nada. Si cambiaron, escribilos encima.</div>';
  h += '<div class="campos">';
  r.campos.forEach(c=>{
    const v = borrador[c.id];
    const heredado = c.arr && ult[c.id]!=null && ult[c.id]!=="" && v===ult[c.id];
    h += '<div class="campo '+(c.t==="texto"?"texto ":"")+(heredado?"heredado":"")+'" data-c="'+c.id+'">'+
      '<label for="f-'+c.id+'">'+esc(c.n)+'</label>';
    if(c.t==="hora"){
      h += '<div class="hora-c" data-on="'+(v?"1":"0")+'">'+
        '<button type="button" class="hora-b" id="f-'+c.id+'" data-on="'+(v?"1":"0")+'">'+
          (v?esc(v):"Marcar hora")+'</button>'+
        '<button type="button" class="hora-x" title="Borrar la hora">&times;</button></div>';
    } else if(c.t==="num"){
      h += '<input id="f-'+c.id+'" type="number" inputmode="decimal" step="any" value="'+esc(v)+'">';
    } else if(c.t==="fecha"){
      h += '<input id="f-'+c.id+'" type="date" value="'+esc(v)+'">';
    } else {
      h += '<input id="f-'+c.id+'" type="text" value="'+esc(v)+'">';
    }
    h += '<p class="arr">Viene del anterior</p></div>';
  });
  h += '</div>';
  h += '<div class="barra-guardar"><div class="in">'+
    '<div class="quien"><select id="quien">'+
      S.cfg.personas.map(p=>'<option'+(p===S.cfg.ultima?" selected":"")+'>'+esc(p)+'</option>').join("")+
    '</select></div>'+
    '<button class="btn ok" id="b-guardar">Guardar</button></div></div>';
  el.innerHTML = h;

  r.campos.forEach(c=>{
    const inp = document.getElementById("f-"+c.id);
    const caja = el.querySelector('[data-c="'+c.id+'"]');
    if(c.t==="hora"){
      const cont = inp.parentElement;
      inp.onclick = ()=>{
        if(inp.dataset.on==="1"){
          const nuevo = window.prompt("Hora para "+c.n+" (hh:mm)", borrador[c.id]);
          if(nuevo==null) return;
          if(!/^\d{1,2}:\d{2}$/.test(nuevo.trim())){ avisar("Escribila como 14:30"); return; }
          borrador[c.id] = nuevo.trim().padStart(5,"0");
        } else {
          borrador[c.id] = ahoraHM();
        }
        inp.textContent = borrador[c.id];
        inp.dataset.on = "1"; cont.dataset.on = "1";
      };
      cont.querySelector(".hora-x").onclick = ()=>{
        borrador[c.id] = ""; inp.textContent = "Marcar hora";
        inp.dataset.on = "0"; cont.dataset.on = "0";
      };
    } else {
      inp.oninput = ()=>{ borrador[c.id] = inp.value; caja.classList.remove("heredado"); };
    }
  });
  document.getElementById("b-guardar").onclick = ()=>{
    const quien = document.getElementById("quien").value;
    const vacio = r.campos.every(c=>c.t==="fecha" || !String(borrador[c.id]||"").trim());
    if(vacio){ avisar("Todavía no cargaste nada"); return; }
    const fila = {fecha: hoyISO(), hora: ahoraHM(), responsable: quien};
    r.campos.forEach(c=>fila[c.id] = borrador[c.id]);
    agregarFila(r.id, fila);
    S.ultimo[r.id] = Object.assign({}, borrador);
    S.cfg.ultima = quien; guardar();
    avisar("Guardado");
    ir("inicio");
  };
}

/* ====================== tareas de higiene ====================== */
function pintarTareas(r, el){
  const hoy = hoyISO();
  const deHoy = filas(r.id).filter(x=>x.fecha===hoy);
  const hecha = (tid, slot)=> deHoy.find(x=>x.tarea===tid && (x.turno||"")===(slot||""));
  let h = '<h1>'+esc(r.nombre)+'</h1>'+
    '<p class="sub">Tocá la tarea cuando la termines. Queda con la hora.</p>';
  let g = null;
  r.tareas.forEach(t=>{
    if(t.g!==g){ h += '<p class="grupo">'+esc(t.g)+'</p>'; g = t.g; }
    h += '<div class="tarea" data-t="'+t.id+'">'+
      '<span class="tn">'+esc(t.n)+'<span class="tf"> · '+esc(t.f)+'</span></span>';
    if(t.f==="ordeñe"){
      h += '<div class="slots">'+["AM","PM"].map(s=>{
        const x = hecha(t.id, s);
        return '<div><span class="slot-l">'+s+'</span>'+
          '<button class="marca" data-slot="'+s+'" data-on="'+(x?"1":"0")+'">'+
          (x?'<span class="h">'+esc(x.hora)+'</span>':'Marcar')+'</button></div>';
      }).join("")+'</div>';
    } else {
      const x = hecha(t.id, "");
      h += '<button class="marca" data-slot="" data-on="'+(x?"1":"0")+'">'+
        (x?'<span class="h">'+esc(x.hora)+'</span>':'Marcar')+'</button>';
    }
    h += '</div>';
  });
  h += '<div class="barra-guardar"><div class="in">'+
    '<div class="quien"><select id="quien">'+
      S.cfg.personas.map(p=>'<option'+(p===S.cfg.ultima?" selected":"")+'>'+esc(p)+'</option>').join("")+
    '</select></div>'+
    '<button class="btn ghost" id="b-listo">Listo</button></div></div>';
  el.innerHTML = h;

  el.querySelectorAll(".marca").forEach(b=>{
    const tid = b.closest(".tarea").dataset.t, slot = b.dataset.slot;
    b.onclick = ()=>{
      const quien = document.getElementById("quien").value;
      const ya = hecha(tid, slot);
      if(ya){
        if(!window.confirm("¿Borrar la marca de esta tarea?")) return;
        S.datos[r.id] = S.datos[r.id].filter(x=>x._id!==ya._id);
        S.pend = S.pend.filter(p=>p.id!==ya._id);
        guardar();
      } else {
        const t = r.tareas.find(x=>x.id===tid);
        agregarFila(r.id, {fecha:hoy, hora:ahoraHM(), tarea:tid,
          tarea_n:t.n, grupo:t.g, frecuencia:t.f, turno:slot, responsable:quien});
        S.cfg.ultima = quien; guardar();
      }
      pintarTareas(r, el);
    };
  });
  document.getElementById("b-listo").onclick = ()=>{ avisar("Guardado"); ir("inicio"); };
}

/* ====================== historial ====================== */
let histReg = REG[0].id;
function pintarHist(){
  const el = document.getElementById("v-hist");
  let h = '<h1>Lo registrado</h1>'+
    '<p class="sub">Todo lo cargado en esta tablet. Se puede descargar para pasarlo a la planilla.</p>'+
    '<div class="fila">'+REG.map(r=>'<button class="chip" data-r="'+r.id+'" aria-pressed="'+
      (r.id===histReg)+'">'+esc(r.nombre)+'</button>').join("")+'</div>';
  const r = regPorId[histReg];
  const f = filas(histReg).slice().reverse();
  if(!f.length) h += '<div class="vacio">Todavía no hay nada en este registro.</div>';
  else {
    const cols = r.tipo==="tareas"
      ? [["fecha","Fecha"],["hora","Hora"],["grupo","Sector"],["tarea_n","Tarea"],
         ["turno","Turno"],["responsable","Responsable"]]
      : [["fecha","Fecha"],["hora","Cargado"]].concat(r.campos.map(c=>[c.id,c.n]))
         .concat([["responsable","Responsable"]]);
    h += '<div class="tabla"><table><thead><tr>'+
      cols.map(c=>'<th>'+esc(c[1])+'</th>').join("")+'</tr></thead><tbody>'+
      f.slice(0,200).map(x=>'<tr>'+cols.map(c=>{
        let v = x[c[0]]; if(/^f_|^fecha$/.test(c[0])) v = dmy(v);
        return '<td'+(/litros|hormas|tina|acidez|t_coc|t_punto|cantidad/.test(c[0])?' class="num"':'')+
          '>'+esc(v==null||v===""?"—":v)+'</td>';
      }).join("")+'</tr>').join("")+'</tbody></table></div>';
    if(f.length>200) h += '<p class="sub" style="margin-top:10px">Se muestran los 200 más recientes de '+f.length+'.</p>';
    h += '<div class="fila"><button class="btn sm" id="b-csv">Descargar este registro</button>'+
      '<button class="btn sm ghost" id="b-csv-todo">Descargar todo</button></div>';
  }
  el.innerHTML = h;
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ histReg=b.dataset.r; pintarHist(); });
  const b1 = document.getElementById("b-csv"), b2 = document.getElementById("b-csv-todo");
  if(b1) b1.onclick = ()=>bajarCSV([histReg]);
  if(b2) b2.onclick = ()=>bajarCSV(REG.map(r=>r.id));
}
function csvDe(regId){
  const r = regPorId[regId], f = filas(regId);
  const cols = r.tipo==="tareas"
    ? ["fecha","hora","grupo","tarea_n","frecuencia","turno","responsable"]
    : ["fecha","hora"].concat(r.campos.map(c=>c.id)).concat(["responsable"]);
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  return [cols.map(q).join(",")].concat(f.map(x=>cols.map(c=>q(x[c])).join(","))).join("\r\n");
}
async function bajarCSV(ids){
  let dl = null;
  try{ dl = window.claude && claude.use ? await claude.use("downloads") : null; }catch(e){ dl = null; }
  if(!dl){ avisar("La descarga no está disponible acá"); return; }
  for(const id of ids){
    if(!filas(id).length) continue;
    try{
      await dl.save({filename: (S.cfg.predio||"registros").replace(/[^\w]+/g,"_")+"_"+id+"_"+hoyISO()+".csv",
        data: "﻿"+csvDe(id)});
    }catch(e){ if(e && e.code==="declined") return; }
  }
  avisar("Descargado");
}

/* ====================== ajustes ====================== */
function pintarAjustes(){
  const el = document.getElementById("v-ajustes");
  el.innerHTML = '<h1>Ajustes</h1>'+
    '<p class="sub">Esto se configura una vez y queda.</p>'+
    '<div class="campos">'+
      '<div class="campo texto"><label for="a-predio">Nombre de la quesería</label>'+
        '<input id="a-predio" type="text" value="'+esc(S.cfg.predio||"")+'"></div>'+
      '<div class="campo texto"><label for="a-personas">Quiénes registran (separados por coma)</label>'+
        '<input id="a-personas" type="text" value="'+esc((S.cfg.personas||[]).join(", "))+'"></div>'+
    '</div>'+
    '<h2>Envío a las planillas</h2>'+
    '<p class="sub">Si están vacías, la app igual funciona: todo queda en la tablet y se baja con el '+
    'botón de descarga. Con las direcciones puestas, cada registro se manda solo cuando hay internet. '+
    'Podés poner dos: se escriben por separado, así queda respaldo en los dos Drive.</p>'+
    '<div class="campo texto"><label for="a-url">Planilla de la quesería</label>'+
      '<input id="a-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="'+
      esc(S.cfg.url||"")+'"></div>'+
    '<div class="campo texto" style="margin-top:14px"><label for="a-url2">Planilla de respaldo (opcional)</label>'+
      '<input id="a-url2" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="'+
      esc(S.cfg.url2||"")+'"></div>'+
    '<div class="fila">'+
      '<button class="btn" id="a-guardar">Guardar ajustes</button>'+
      '<button class="btn sm ghost" id="a-probar">Probar el envío</button>'+
      '<button class="btn sm ghost" id="a-reenviar">Reenviar todo</button>'+
    '</div>'+
    '<div class="aviso"><b>Pendientes de envío: '+S.pend.length+'.</b> '+
    (destinos().length>1 ? "Cada uno se manda a las dos planillas. " : "")+
    'Quedan guardados hasta que haya internet; no se pierden si se apaga la tablet.</div>';
  document.getElementById("a-guardar").onclick = ()=>{
    S.cfg.predio = document.getElementById("a-predio").value.trim() || "Registros";
    S.cfg.personas = document.getElementById("a-personas").value.split(",")
      .map(x=>x.trim()).filter(Boolean);
    if(!S.cfg.personas.length) S.cfg.personas = ["Responsable"];
    S.cfg.url = document.getElementById("a-url").value.trim();
    S.cfg.url2 = document.getElementById("a-url2").value.trim();
    guardar(); avisar("Ajustes guardados"); ir("inicio");
  };
  document.getElementById("a-reenviar").onclick = ()=>{
    const total = REG.reduce((s,r)=>s+filas(r.id).length, 0);
    if(!total){ avisar("Todavía no hay nada que reenviar"); return; }
    if(!window.confirm("Se mandan de nuevo los "+total+" registros a las planillas configuradas. "+
      "Las filas que ya llegaron no se duplican. ¿Seguir?")) return;
    S.pend = [];
    REG.forEach(r=>filas(r.id).forEach(f=>S.pend.push({reg:r.id, id:f._id})));
    guardar(); avisar("Reenviando "+total+" registros"); sincronizar(); pintarAjustes();
  };
  document.getElementById("a-probar").onclick = async ()=>{
    const urls = [document.getElementById("a-url").value.trim(),
                  document.getElementById("a-url2").value.trim()].filter(Boolean);
    if(!urls.length){ avisar("Primero poné al menos una dirección"); return; }
    let ok = 0;
    for(const url of urls){
      try{
        await fetch(url, {method:"POST", mode:"no-cors",
          headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify({filas:[{registro:"prueba", _id:"prueba-"+Date.now()+"-"+ok,
            predio:S.cfg.predio, fecha:hoyISO(), hora:ahoraHM(),
            responsable:"prueba de conexión"}]})});
        ok++;
      }catch(e){}
    }
    avisar(ok ? "Enviado a "+ok+(ok===1?" planilla. Fijate si llegó":" planillas. Fijate si llegó")
              : "No se pudo enviar");
  };
}

/* ====================== varios ====================== */
let tid;
function avisar(m){
  const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(tid); tid = setTimeout(()=>t.classList.remove("on"), 2000);
}
ir("inicio");
</script>
